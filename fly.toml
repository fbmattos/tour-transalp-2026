# fly.toml — static Vite build served by nginx
# Run `fly launch --no-deploy` once to create/claim the app name, then `fly deploy`.
app = "woodenlegs-mallorca"
primary_region = "cdg"  # Paris — closest non-deprecated EU region (mad is deprecated)

[build]
  [build.args]
    VITE_TRIP = "mallorca-2026"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
